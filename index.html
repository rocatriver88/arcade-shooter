<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际突击 - 街机射击游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="720" height="960"></canvas>
        
        <div id="ui-layer">
            <div id="level-display" class="hidden">关卡: <span id="level">1</span></div>
            <div id="score-display" class="hidden">分数: <span id="score">0</span><br><span style="font-size: 14px; color: #888; text-shadow: none;">最高分: <span id="high-score">0</span></span></div>
            <div id="lives-display" class="hidden">生命: <span id="lives">3</span></div>
            <div id="bombs-display" class="hidden">炸弹: <span id="bombs">3</span></div>
            <div id="audio-toggle" class="hidden">🔊 音乐: 关</div>
            <button id="bomb-btn" class="hidden">💣</button>
            
            <div id="start-screen" class="screen">
                <h1>星际突击</h1>
                <p>使用 WASD 或方向键移动</p>
                <p>按 空格键 射击</p>
                <button id="start-btn">开始游戏</button>
            </div>
            
            <div id="game-over-screen" class="screen hidden">
                <h1 style="color: #f00; text-shadow: 0 0 10px #f00;">游戏结束</h1>
                <p>最终分数: <span id="final-score">0</span></p>
                <button id="restart-btn">重新开始</button>
            </div>
            
            <div id="victory-screen" class="screen hidden">
                <h1 style="color: #0f0; text-shadow: 0 0 10px #0f0;">任务完成！</h1>
                <p>你拯救了星际！</p>
                <p>最终分数: <span id="victory-score">0</span></p>
                <button onclick="startGame()">再次游玩</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
