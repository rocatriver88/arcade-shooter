<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际突击 - 街机射击游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        
        <div id="ui-layer">
            <div id="level-display" class="hidden">关卡: <span id="level">1</span></div>
            <div id="score-display" class="hidden">分数: <span id="score">0</span></div>
            <div id="lives-display" class="hidden">生命: <span id="lives">3</span></div>
            
            <div id="start-screen" class="screen">
                <h1>星际突击</h1>
                <p>使用 WASD 或方向键移动</p>
                <p>按 空格键 射击</p>
                <button id="start-btn">开始游戏</button>
            </div>
            
            <div id="game-over-screen" class="screen hidden">
                <h1>游戏结束</h1>
                <p>最终分数: <span id="final-score">0</span></p>
                <button id="restart-btn">重新开始</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
